<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>店店找｜店面頂讓・二手器具・餐飲設備・加盟品牌</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#fbf7f1;color:#1f2a44;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.awning{background:repeating-linear-gradient(90deg,#f97316 0 28px,#fff7ed 28px 56px);height:10px}
.card{transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,60,140,.12)}
</style>
</head>
<body class="min-h-screen flex flex-col">
<div class="awning"></div>
<div id="app" class="flex-1"></div>
<footer class="mt-10 bg-[#1b3a8a] text-white">
  <div class="max-w-6xl mx-auto px-4 py-6 text-sm leading-relaxed">
    <p class="font-bold text-base mb-2">⚠️ 免責聲明</p>
    <p class="bg-white/10 border border-white/30 rounded-lg p-3">本平台僅提供資訊刊登與媒合，所有金錢交易與實體點交請買賣雙方當面確認，切勿輕易先匯訂金，以防受騙。</p>
    <p class="mt-3 text-white/70">© 店店找　｜　💡 燈號：綠＝尚無檢舉、黃＝有疑慮、紅＝高風險　｜　「已認證」代表管理員已核對賣家資料，不代表商品品質保證。</p>
  </div>
</footer>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 bg-[#1f2a44] text-white px-4 py-2 rounded-full text-sm hidden z-50"></div>

<script>
const CATS=["店面頂讓","二手器具","餐飲設備","加盟品牌"];
const ICON={"店面頂讓":"🏪","二手器具":"🧊","餐飲設備":"🍳","加盟品牌":"🤝"};
const GRAD={"店面頂讓":"from-rose-400 to-red-500","二手器具":"from-sky-400 to-blue-600","餐飲設備":"from-amber-300 to-orange-500","加盟品牌":"from-green-400 to-green-600"};
const CITIES=["台北市","新北市","桃園市","新竹市","台中市","台南市","高雄市","其他"];
const KEY="ddz_v1";
const now=Date.now(),D=864e5;
function seed(){return{
 me:{role:"guest",appId:null},
 apps:[{id:"a1",name:"林老闆",phone:"0912-345-678",line:"lin_shop",status:"approved"},{id:"a2",name:"陳店長",phone:"0988-111-222",line:"chen88",status:"pending"}],
 items:[
 {id:"i1",title:"台北大安區 30坪餐廳頂讓（含裝潢）",cat:"店面頂讓",price:"680000",city:"台北市",img:"",desc:"近捷運站，人潮穩定，租約尚餘2年。含全套裝潢、抽油煙機、冷氣。因搬遷出讓。",contact:"林老闆 LINE: lin_shop",seller:"a1",time:now-1*D,verified:true,reports:[]},
 {id:"i2",title:"九成新 雙門冷藏冰箱 4尺",cat:"二手器具",price:"12000",city:"台中市",img:"",desc:"使用一年，運作正常，可試機。限自取。",contact:"林老闆 0912-345-678",seller:"a1",time:now-2*D,verified:true,reports:[]},
 {id:"i3",title:"商用瓦斯快速爐＋炒台組",cat:"餐飲設備",price:"面議",city:"高雄市",img:"",desc:"餐廳結束營業，整組出售，可分售。",contact:"林老闆 LINE: lin_shop",seller:"a1",time:now-3*D,verified:false,reports:[{reason:"價格與描述不符",time:now-D}]},
 {id:"i4",title:"手搖飲品牌加盟｜低坪數創業首選",cat:"加盟品牌",price:"面議",city:"新北市",img:"",desc:"加盟金與設備費詳談，提供教育訓練與開店輔導。",contact:"林老闆 0912-345-678",seller:"a1",time:now-4*D,verified:false,reports:[{reason:"要求先匯訂金",time:now-D},{reason:"疑似詐騙",time:now-D},{reason:"聯絡不上",time:now-D}]}
 ]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add("hidden"),2200)}
const money=p=>/^\d+$/.test(p)?"NT$ "+Number(p).toLocaleString():"面議";
const ago=t=>{const d=Math.floor((Date.now()-t)/D);return d<1?"今天":d+" 天前"};
const myApp=()=>S.apps.find(a=>a.id===S.me.appId);
const canPost=()=>S.me.role==="admin"||(S.me.role==="seller"&&myApp()?.status==="approved");

/* 燈泡：綠(0檢舉) 黃(1-2) 紅(3+) */
function bulb(n,size=22){const c=n>=3?["#ef4444","高風險"]:n>=1?["#f59e0b","有疑慮"]:["#22c55e","尚無檢舉"];
 return `<span title="${c[1]}（${n} 件檢舉）" class="inline-flex items-center gap-1 text-xs font-bold" style="color:${c[0]}"><svg width="${size}" height="${size}" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z" fill="${c[0]}"/><rect x="9" y="18" width="6" height="2" rx="1" fill="#94a3b8"/><rect x="10" y="21" width="4" height="1.6" rx=".8" fill="#94a3b8"/></svg>${c[1]}</span>`}
const badge=v=>v?`<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-green-100 text-green-700">✔ 已認證</span>`:`<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-slate-200 text-slate-600">未認證</span>`;
const live=()=>S.items.filter(i=>!i.hidden).sort((a,b)=>b.time-a.time);

function thumb(i,h="h-40"){return i.img?`<img src="${esc(i.img)}" alt="" class="w-full ${h} object-cover" onerror="this.outerHTML='<div class=&quot;w-full ${h} bg-slate-200 flex items-center justify-center text-4xl&quot;>${ICON[i.cat]}</div>'">`
 :`<div class="w-full ${h} bg-gradient-to-br ${GRAD[i.cat]} flex items-center justify-center text-6xl">${ICON[i.cat]}</div>`}
function itemCard(i){return `<a href="#/item/${i.id}" class="card block bg-white rounded-2xl overflow-hidden border border-orange-100">
 ${thumb(i)}<div class="p-3"><div class="flex justify-between items-center mb-1"><span class="text-xs px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 font-bold">${i.cat}</span>${bulb(i.reports.length,18)}</div>
 <h3 class="font-bold leading-snug line-clamp-2 min-h-[2.6em]">${esc(i.title)}</h3>
 <div class="mt-1 text-orange-600 font-extrabold text-lg">${money(i.price)}</div>
 <div class="flex justify-between items-center mt-1 text-xs text-slate-500"><span>📍 ${esc(i.city)}・${ago(i.time)}</span>${badge(i.verified)}</div></div></a>`}

function nav(){const r=S.me.role;
 return `<header class="bg-white border-b border-orange-100 sticky top-0 z-40"><div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
 <a href="#/" class="text-2xl font-black"><span class="text-[#1b3a8a]">店店</span><span class="text-orange-500">找</span> 🔍</a>
 <nav class="hidden lg:flex gap-1">${CATS.map(c=>`<a href="#/cat/${c}" class="px-3 py-1.5 rounded-full text-sm font-bold hover:bg-orange-50">${ICON[c]} ${c}</a>`).join("")}</nav>
 <form onsubmit="return navSearch(event)" class="flex-1 min-w-[160px] flex"><input id="navq" placeholder="搜尋商品…" class="w-full border border-slate-300 rounded-l-full px-4 py-1.5 text-sm outline-none focus:border-orange-400"><button class="bg-orange-500 text-white px-4 rounded-r-full text-sm font-bold">搜尋</button></form>
 <a href="#/post" class="bg-[#1b3a8a] text-white font-bold px-4 py-2 rounded-full text-sm">＋ 發布商品</a>
 ${r==="admin"?`<a href="#/admin" class="bg-red-500 text-white font-bold px-3 py-2 rounded-full text-sm">管理後台</a>`:""}
 <select onchange="setRole(this.value)" class="border border-slate-300 rounded-lg text-xs px-2 py-1.5" title="示範用：切換身分">
  <option value="guest" ${r==="guest"?"selected":""}>身分：訪客</option><option value="seller" ${r==="seller"?"selected":""}>身分：賣家</option><option value="admin" ${r==="admin"?"selected":""}>身分：管理員</option></select>
 </div></header>`}
window.setRole=v=>{S.me.role=v;if(v==="seller"&&!S.me.appId){const a=S.apps.find(x=>x.id==="a1");}save();toast("已切換為："+({guest:"訪客",seller:"賣家",admin:"管理員"}[v]));route()};
window.navSearch=e=>{e.preventDefault();Q.kw=$("navq").value;Q.cat="";location.hash="#/";route();return false};

let Q={kw:"",cat:""};
function home(cat){if(cat!==undefined)Q.cat=cat;
 let list=live().filter(i=>(!Q.cat||i.cat===Q.cat)&&(!Q.kw||(i.title+i.desc+i.city).includes(Q.kw)));
 return `<section class="bg-gradient-to-b from-orange-100 to-[#fbf7f1]"><div class="max-w-6xl mx-auto px-4 py-8">
 <h1 class="text-3xl md:text-5xl font-black text-[#1b3a8a] leading-tight">想頂店、找設備、挑品牌？<br><span class="text-orange-500">店店幫你找。</span></h1>
 <form onsubmit="return doSearch(event)" class="mt-5 bg-white rounded-2xl shadow p-3 flex flex-col md:flex-row gap-2">
  <input id="kw" value="${esc(Q.kw)}" placeholder="輸入關鍵字，例如：冰箱、大安區、手搖飲" class="flex-1 border border-slate-300 rounded-xl px-4 py-2.5 outline-none focus:border-orange-400">
  <select id="cf" class="border border-slate-300 rounded-xl px-3 py-2.5"><option value="">全部分類</option>${CATS.map(c=>`<option ${Q.cat===c?"selected":""}>${c}</option>`).join("")}</select>
  <button class="bg-orange-500 text-white font-bold rounded-xl px-8 py-2.5">搜尋</button></form>
 <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5">${CATS.map(c=>`<a href="#/cat/${c}" class="card rounded-2xl p-4 text-white font-bold text-center bg-gradient-to-br ${GRAD[c]}"><div class="text-4xl">${ICON[c]}</div><div class="mt-1">${c}</div><div class="text-xs opacity-80">${live().filter(i=>i.cat===c).length} 筆刊登</div></a>`).join("")}</div>
 </div></section>
 <main class="max-w-6xl mx-auto px-4 mt-6"><h2 class="text-xl font-black mb-3">${Q.cat?ICON[Q.cat]+" "+Q.cat:"最新刊登"} <span class="text-sm font-normal text-slate-500">共 ${list.length} 筆</span></h2>
 ${list.length?`<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">${list.map(itemCard).join("")}</div>`:`<p class="text-slate-500 py-10 text-center">找不到符合的商品，試試其他關鍵字，或<a class="text-orange-600 font-bold" href="#/post">發布第一筆</a>。</p>`}</main>`}
window.doSearch=e=>{e.preventDefault();Q.kw=$("kw").value.trim();Q.cat=$("cf").value;route();return false};

function detail(id){const i=S.items.find(x=>x.id===id);if(!i)return `<p class="p-10 text-center">找不到此商品。<a href="#/" class="text-orange-600">回首頁</a></p>`;
 const n=i.reports.length;
 return `<main class="max-w-5xl mx-auto px-4 mt-5"><a href="#/" class="text-sm text-slate-500">← 返回列表</a>
 <div class="grid md:grid-cols-2 gap-6 mt-3"><div class="rounded-2xl overflow-hidden border border-orange-100 bg-white">${thumb(i,"h-72 md:h-96")}</div>
 <div class="bg-white rounded-2xl p-5 border border-orange-100">
  <div class="flex flex-wrap gap-2 items-center"><span class="text-xs px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 font-bold">${i.cat}</span>${badge(i.verified)}${bulb(n)}</div>
  <h1 class="text-2xl font-black mt-2 leading-snug">${esc(i.title)}</h1>
  <div class="text-3xl font-black text-orange-600 mt-2">${money(i.price)}</div>
  <dl class="grid grid-cols-2 gap-2 text-sm mt-3"><dt class="text-slate-500">所在縣市</dt><dd>📍 ${esc(i.city)}</dd><dt class="text-slate-500">上架時間</dt><dd>${new Date(i.time).toLocaleDateString("zh-TW")}（${ago(i.time)}）</dd><dt class="text-slate-500">分類</dt><dd>${i.cat}</dd></dl>
  ${n>=3?`<p class="mt-3 text-sm bg-red-50 text-red-700 rounded-lg p-2">🚨 此刊登已被檢舉 ${n} 次，請特別小心，切勿先匯款。</p>`:""}
  ${!i.verified?`<p class="mt-3 text-sm bg-amber-50 text-amber-800 rounded-lg p-2">此賣家／商品尚未通過管理員認證，請加強確認。</p>`:""}
  <div id="contact" class="mt-4"><button onclick="showContact('${i.id}')" class="w-full bg-[#1b3a8a] text-white font-bold py-3 rounded-xl">📞 聯絡賣家</button></div>
  <button onclick="openReport('${i.id}')" class="mt-2 w-full border border-red-300 text-red-600 font-bold py-2 rounded-xl text-sm">💡 檢舉此刊登</button>
  <div id="rep"></div>
 </div></div>
 <section class="bg-white rounded-2xl p-5 border border-orange-100 mt-5"><h2 class="font-black mb-2">商品描述</h2><p class="whitespace-pre-line leading-relaxed">${esc(i.desc)}</p></section>
 <p class="text-xs text-slate-500 mt-3">防詐提醒：請當面驗貨、當面交易，不要先匯訂金。</p></main>`}
window.showContact=id=>{const i=S.items.find(x=>x.id===id);$("contact").innerHTML=`<div class="bg-green-50 border border-green-300 rounded-xl p-3"><div class="text-xs text-green-700">賣家聯絡方式</div><div class="font-black text-lg">${esc(i.contact)}</div><div class="text-xs text-slate-500 mt-1">請勿先匯訂金，建議當面確認。</div></div>`};
window.openReport=id=>{$("rep").innerHTML=`<div class="mt-2 border border-red-200 rounded-xl p-3"><select id="rr" class="w-full border rounded-lg p-2 text-sm">${["要求先匯訂金","疑似詐騙","價格與描述不符","照片盜用","聯絡不上","其他"].map(r=>`<option>${r}</option>`).join("")}</select><button onclick="doReport('${id}')" class="mt-2 w-full bg-red-500 text-white font-bold py-2 rounded-lg text-sm">送出檢舉</button></div>`};
window.doReport=id=>{const i=S.items.find(x=>x.id===id);i.reports.push({reason:$("rr").value,time:Date.now()});save();toast("已收到檢舉，管理員會處理");route()};

function postPage(){
 if(S.me.role==="guest")return gate("請先登入","目前為示範模式，請從右上角「身分」切換為「賣家」，再申請賣家資格。");
 if(S.me.role==="seller"&&!canPost()){const a=myApp();
  if(a&&a.status==="pending")return gate("⏳ 賣家申請審核中","管理員通過審核後，才可以上架商品。（示範：切換為「管理員」到後台核准）");
  if(a&&a.status==="rejected")return gate("申請未通過","請聯絡平台管理員。");
  return `<main class="max-w-xl mx-auto px-4 mt-6"><h1 class="text-2xl font-black">申請成為賣家</h1><p class="text-sm text-slate-600 mt-1">需經管理員審核通過，才能上架商品。審核通過後，你的刊登可獲「已認證」標章。</p>
  <form onsubmit="return applySeller(event)" class="bg-white rounded-2xl p-5 border border-orange-100 mt-4 space-y-3">
   ${fld("姓名／店名","an","required")}${fld("手機號碼","ap","required")}${fld("LINE ID（選填）","al","")}
   <button class="w-full bg-orange-500 text-white font-bold py-3 rounded-xl">送出申請</button></form></main>`}
 return `<main class="max-w-xl mx-auto px-4 mt-6"><h1 class="text-2xl font-black">發布商品</h1>
 <form onsubmit="return doPost(event)" class="bg-white rounded-2xl p-5 border border-orange-100 mt-4 space-y-3">
  ${fld("商品標題","pt","required")}
  <label class="block text-sm font-bold">分類<select id="pc" class="mt-1 w-full border rounded-xl p-2.5 font-normal">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></label>
  <div class="text-sm font-bold">價格<div class="flex gap-2 mt-1"><input id="pp" type="number" min="0" placeholder="例如 12000" class="flex-1 border rounded-xl p-2.5 font-normal"><label class="flex items-center gap-1 font-normal"><input id="pn" type="checkbox" onchange="$('pp').disabled=this.checked"> 面議</label></div></div>
  <label class="block text-sm font-bold">所在地區<select id="pcity" class="mt-1 w-full border rounded-xl p-2.5 font-normal">${CITIES.map(c=>`<option>${c}</option>`).join("")}</select></label>
  <div class="text-sm font-bold">圖片<input id="pf" type="file" accept="image/*" onchange="readImg(this)" class="mt-1 block w-full text-sm font-normal"><input id="pu" placeholder="或貼上圖片網址 https://…" class="mt-2 w-full border rounded-xl p-2.5 font-normal"><img id="pv" class="hidden mt-2 h-24 rounded-lg"></div>
  <label class="block text-sm font-bold">詳細描述<textarea id="pd" rows="5" required class="mt-1 w-full border rounded-xl p-2.5 font-normal"></textarea></label>
  ${fld("聯絡人與電話／LINE ID","pco","required")}
  <button class="w-full bg-[#1b3a8a] text-white font-bold py-3 rounded-xl">送出刊登</button></form></main>`}
const fld=(l,id,r)=>`<label class="block text-sm font-bold">${l}<input id="${id}" ${r} class="mt-1 w-full border rounded-xl p-2.5 font-normal"></label>`;
const gate=(t,m)=>`<main class="max-w-xl mx-auto px-4 mt-10 text-center bg-white rounded-2xl p-8 border border-orange-100"><h1 class="text-2xl font-black">${t}</h1><p class="mt-2 text-slate-600">${m}</p><a href="#/" class="inline-block mt-4 text-orange-600 font-bold">回首頁</a></main>`;
let IMG="";
window.readImg=el=>{const f=el.files[0];if(!f)return;if(f.size>1.5e6){toast("圖片請小於 1.5MB");el.value="";return}const r=new FileReader();r.onload=()=>{IMG=r.result;$("pv").src=IMG;$("pv").classList.remove("hidden")};r.readAsDataURL(f)};
window.applySeller=e=>{e.preventDefault();const a={id:"a"+Date.now(),name:$("an").value,phone:$("ap").value,line:$("al").value,status:"pending"};S.apps.push(a);S.me.appId=a.id;save();toast("申請已送出，等待管理員審核");route();return false};
window.doPost=e=>{e.preventDefault();
 const url=$("pu").value.trim();const a=myApp();
 const it={id:"i"+Date.now(),title:$("pt").value,cat:$("pc").value,price:$("pn").checked||!$("pp").value?"面議":$("pp").value,city:$("pcity").value,img:IMG||url,desc:$("pd").value,contact:$("pco").value,seller:a?a.id:"admin",time:Date.now(),verified:false,reports:[]};
 S.items.push(it);IMG="";save();toast("刊登成功！");location.hash="#/item/"+it.id;return false};

function admin(){if(S.me.role!=="admin")return gate("僅限管理員","請從右上角切換為「管理員」。");
 const pend=S.apps.filter(a=>a.status==="pending");
 const rep=S.items.filter(i=>i.reports.length).sort((a,b)=>b.reports.length-a.reports.length);
 return `<main class="max-w-5xl mx-auto px-4 mt-6 space-y-6"><h1 class="text-2xl font-black">管理後台</h1>
 <section class="bg-white rounded-2xl p-5 border border-orange-100"><h2 class="font-black mb-2">① 賣家申請審核（${pend.length} 待審）</h2>
  ${S.apps.map(a=>`<div class="flex flex-wrap items-center gap-2 border-t py-2 text-sm"><b>${esc(a.name)}</b><span class="text-slate-500">${esc(a.phone)} ${a.line?"LINE:"+esc(a.line):""}</span>
   <span class="px-2 rounded-full text-xs ${a.status==="approved"?"bg-green-100 text-green-700":a.status==="pending"?"bg-amber-100 text-amber-700":"bg-red-100 text-red-700"}">${{approved:"已通過",pending:"待審核",rejected:"已拒絕"}[a.status]}</span>
   <span class="ml-auto flex gap-1">${a.status!=="approved"?`<button onclick="appSet('${a.id}','approved')" class="bg-green-500 text-white px-3 py-1 rounded-lg">通過</button>`:""}${a.status!=="rejected"?`<button onclick="appSet('${a.id}','rejected')" class="bg-red-500 text-white px-3 py-1 rounded-lg">拒絕／停權</button>`:""}</span></div>`).join("")}</section>
 <section class="bg-white rounded-2xl p-5 border border-orange-100"><h2 class="font-black mb-2">② 刊登管理與認證</h2>
  ${S.items.map(i=>`<div class="flex flex-wrap items-center gap-2 border-t py-2 text-sm"><a href="#/item/${i.id}" class="font-bold hover:text-orange-600">${esc(i.title)}</a>${badge(i.verified)}${bulb(i.reports.length,16)}
   <span class="ml-auto flex gap-1"><button onclick="verify('${i.id}')" class="border px-3 py-1 rounded-lg">${i.verified?"取消認證":"標記已認證"}</button><button onclick="hideItem('${i.id}')" class="bg-red-500 text-white px-3 py-1 rounded-lg">下架刪除</button></span></div>`).join("")}</section>
 <section class="bg-white rounded-2xl p-5 border border-orange-100"><h2 class="font-black mb-2">③ 檢舉紀錄</h2>
  ${rep.length?rep.map(i=>`<div class="border-t py-2 text-sm"><b>${esc(i.title)}</b> ${bulb(i.reports.length,16)}<ul class="list-disc ml-5 text-slate-600">${i.reports.map(r=>`<li>${esc(r.reason)}（${ago(r.time)}）</li>`).join("")}</ul><button onclick="clearRep('${i.id}')" class="mt-1 text-xs border px-2 py-1 rounded-lg">查證無誤，清除檢舉</button></div>`).join(""):`<p class="text-slate-500 text-sm">目前沒有檢舉。</p>`}</section></main>`}
window.appSet=(id,s)=>{S.apps.find(a=>a.id===id).status=s;save();toast("已更新");route()};
window.verify=id=>{const i=S.items.find(x=>x.id===id);i.verified=!i.verified;save();route()};
window.hideItem=id=>{if(confirm("確定下架並刪除？")){S.items=S.items.filter(x=>x.id!==id);save();route()}};
window.clearRep=id=>{S.items.find(x=>x.id===id).reports=[];save();route()};

function route(){const h=location.hash||"#/";let body;
 if(h.startsWith("#/item/"))body=detail(h.slice(7));
 else if(h==="#/post")body=postPage();
 else if(h==="#/admin")body=admin();
 else if(h.startsWith("#/cat/")){Q.kw="";body=home(decodeURIComponent(h.slice(6)))}
 else{if(h==="#/"&&!Q.kw&&!Q.cat);body=home()}
 $("app").innerHTML=nav()+body;window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
